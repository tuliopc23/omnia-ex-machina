name: Bug report
description: Something looks wrong or broken with the theme
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the visual or behavioral problem. A screenshot helps enormously.
      placeholder: "e.g. Callouts lost their left accent rail after the last update…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: false
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      description: Settings → About (e.g. 1.9.x). Also note installer version if different.
    validations:
      required: true
  - type: input
    id: theme-version
    attributes:
      label: Theme version
      description: Settings → Appearance → Omnia Ex Machina (e.g. 1.0.0).
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Where does it happen?
      options:
        - Light mode
        - Dark mode
        - Both
        - Mobile
    validations:
      required: true
  - type: textarea
    id: plugins
    attributes:
      label: Community plugins enabled
      description: Especially any that touch the affected surface (e.g. Kanban, Omnisearch, Excalidraw).
    validations:
      required: false
